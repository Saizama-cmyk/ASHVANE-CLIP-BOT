<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ashvane Core scene</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070D;color:#9FADC2;font:13px system-ui,sans-serif}#scene{position:absolute;inset:0}.supervisor-neural-canvas{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:pan-y}#status{position:absolute;left:20px;right:20px;bottom:14px;margin:0;pointer-events:none;font-size:12px;line-height:18px}.ready #status{display:none}
</style></head><body><div id="scene" aria-label="Reported supervisor agent constellation"></div><p id="status">Loading the local Core scene…</p>
<script>
/* Public graphics shell. No authenticated requests, tokens, eval or mutable API controls. */
(() => {
  let scene = null, current = null, selected = '', active = true;
  const parentOrigin = new URL(location.href).searchParams.get('parent_origin');
  const ids = value => typeof value === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(value);
  const rows = value => Array.isArray(value) ? value : [];
  const text = value => typeof value === 'string' ? value.slice(0,160) : '';
  const stamp = value => typeof value === 'number' && Number.isFinite(value) ? value : null;
  const receipt = row => row && ids(row.id) && ids(row.role) && ['tool_completed','tool_failed'].includes(row.kind) && stamp(row.at) !== null;
  const emit = message => {
    const value = JSON.stringify(message);
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(value);
    else if (parent !== window && parentOrigin) parent.postMessage(value, parentOrigin);
  };
  const status = value => {
    document.body.classList.toggle('ready',value === 'ready');
    document.getElementById('status').textContent = value === 'paused' ? '3D view paused. Agent controls remain below.' : '3D view unavailable. Agent controls remain below.';
    emit({type:'ashvane-core-status',status:value});
  };
  const receive = event => {
    if (event.source && event.source !== window && event.source !== parent) return;
    if (event.source === parent && parent !== window && (!parentOrigin || event.origin !== parentOrigin)) return;
    if (typeof event.data === 'string' && event.data.length > 131072) return;
    let message;
    try { message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; if (new TextEncoder().encode(JSON.stringify(message)).byteLength > 131072) return; } catch { return; }
    if (!message || message.type !== 'ashvane-core-snapshot' || !message.snapshot || !Array.isArray(message.snapshot.agents)) return;
    const value = message.snapshot;
    current = {enabled:value.enabled===true,state:text(value.state),
      agents:rows(value.agents).slice(0,48).filter(row=>row && ids(row.id)).map(row=>({id:row.id,name:text(row.name),status:text(row.status)})),
      events:rows(value.events).slice(-128).filter(row=>row && ids(row.id)).map(row=>({id:row.id,role:ids(row.role)?row.role:'',kind:text(row.kind),at:stamp(row.at)})),
      work_receipts:rows(value.work_receipts).slice(-128).filter(receipt).map(row=>({id:row.id,role:row.role,kind:row.kind,at:row.at})),
      goals:rows(value.goals).slice(-128).filter(row=>row && ids(row.id)).map(row=>({id:row.id,parent:ids(row.parent)?row.parent:'',agent:ids(row.agent)?row.agent:'',created_at:stamp(row.created_at)}))};
    selected = ids(message.selected) && current.agents.some(row=>row.id===message.selected) ? message.selected : '';
    active = message.active === true;
    scene?.update(current,selected); scene?.setSelected(selected); scene?.setActive?.(active);
  };
  window.addEventListener('message',receive);
  import('./supervisor-neural.js?v=0712e86a8e67f695').then(module => {
    scene = module.create(document.getElementById('scene'),{onStatus:status,onSelect:id=>{
      if (ids(id) && current?.agents.some(row=>row.id===id)) emit({type:'ashvane-core-select',id});
    }});
    if (current) { scene.update(current,selected); scene.setSelected(selected); }
    scene.setActive?.(active); status('ready');
  }).catch(() => status('unavailable'));
  window.addEventListener('pagehide',()=>{scene?.destroy?.();scene?.dispose?.();scene=null;},{once:true});
})();
</script></body></html>
