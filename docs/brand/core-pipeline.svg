<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="title desc"><title id="title">Core repair pipeline and hold boundaries</title><desc id="desc">Observe actual health and receipts; plan with a local director; stage an engineer patch against current hashes; run isolated baseline, expected failing reproduction and passing candidate checks; independently review; promote eligible source and a hash-pinned overlay. Missing evidence holds. Activation requires idle drain and startup health; rollback is preserved. The real demonstration repaired only a disposable UUID example.</desc><defs><style>text{font-family:'Space Grotesk','IBM Plex Sans',Arial,sans-serif;fill:#F0F4FA}.body{font-family:'IBM Plex Sans',Arial,sans-serif;font-size:26px;fill:#9FADC2}.small{font-size:22px;fill:#9FADC2}.label{font-size:25px;fill:#F1BC7A}.heading{font-size:34px;font-weight:600}.line{fill:none;stroke:#9FADC2;stroke-width:2}.box{fill:#0E1523;stroke:#273449;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9FADC2"/></marker></defs><rect width="1600" height="740" fill="#05070D"/><text x="60" y="76" font-size="50" font-weight="600">Core earns a change through evidence.</text><text x="60" y="126" class="body" >One bounded repair path. Unmet prerequisites hold the change.</text><path d="M280 299H304" class="line" marker-end="url(#arrow)"/><rect x="60" y="210" width="220" height="208" rx="14" class="box" /><text x="82" y="255" class="label" >01</text><text x="82" y="303" class="heading" >Observe</text><text x="82" y="350" class="small" >Health / faults</text><text x="82" y="384" class="small" >Real receipts</text><path d="M530 299H554" class="line" marker-end="url(#arrow)"/><rect x="310" y="210" width="220" height="208" rx="14" class="box" /><text x="332" y="255" class="label" >02</text><text x="332" y="303" class="heading" >Plan</text><text x="332" y="350" class="small" >Local director</text><text x="332" y="384" class="small" >Shared budget</text><path d="M780 299H804" class="line" marker-end="url(#arrow)"/><rect x="560" y="210" width="220" height="208" rx="14" class="box" /><text x="582" y="255" class="label" >03</text><text x="582" y="303" class="heading" >Stage</text><text x="582" y="350" class="small" >Engineer patch</text><text x="582" y="384" class="small" >Pinned hashes</text><path d="M1030 299H1054" class="line" marker-end="url(#arrow)"/><rect x="810" y="210" width="220" height="208" rx="14" class="box" style="stroke:#F1BC7A"/><text x="832" y="255" class="label" >04</text><text x="832" y="303" class="heading" >Isolate</text><text x="832" y="350" class="small" >Baseline + repro</text><text x="832" y="384" class="small" >Candidate checks</text><path d="M1280 299H1304" class="line" marker-end="url(#arrow)"/><rect x="1060" y="210" width="220" height="208" rx="14" class="box" /><text x="1082" y="255" class="label" >05</text><text x="1082" y="303" class="heading" >Review</text><text x="1082" y="350" class="small" >Fresh verdict</text><text x="1082" y="384" class="small" >Actual patch</text><rect x="1310" y="210" width="220" height="208" rx="14" class="box" /><text x="1332" y="255" class="label" >06</text><text x="1332" y="303" class="heading" >Promote</text><text x="1332" y="350" class="small" >Eligible source</text><text x="1332" y="384" class="small" >Pinned overlay</text><path d="M1170 418V450H420V473M920 418V450" class="line" stroke-dasharray="7 6"/><rect x="60" y="473" width="720" height="118" rx="14" class="box"/><text x="86" y="519" class="heading" >Missing evidence means hold</text><text x="86" y="558" class="small" >No host fallback · no fabricated success · no budget refill</text><rect x="820" y="503" width="720" height="118" rx="14" class="box"/><text x="846" y="549" class="heading" >Idle drain → activate → health check</text><text x="846" y="588" class="small" >Failed boot restores prior overlay; owner edits are preserved</text><path d="M1420 418V486" class="line" marker-end="url(#arrow)"/><text x="60" y="690" class="small" >Demonstrated: a disposable UUID repair. Production autonomous repair remains unestablished.</text></svg>
