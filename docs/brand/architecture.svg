<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc"><title id="title">Ashvane system architecture</title><desc id="desc">Owner desktop and phone interfaces connect to four independent workspaces. Shared local engines, scoped queues and credentials, and Core maintenance operate on the workstation. Only Surge and Hollow publish to authorized external destinations.</desc><defs><style>text{font-family:'Space Grotesk','IBM Plex Sans',Arial,sans-serif;fill:#F0F4FA}.body{font-family:'IBM Plex Sans',Arial,sans-serif;font-size:26px;fill:#9FADC2}.small{font-size:22px;fill:#9FADC2}.label{font-size:25px;fill:#F1BC7A}.heading{font-size:34px;font-weight:600}.line{fill:none;stroke:#9FADC2;stroke-width:2}.box{fill:#0E1523;stroke:#273449;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9FADC2"/></marker></defs><rect width="1600" height="1010" fill="#05070D"/><text x="60" y="72" font-size="47" font-weight="600">One workstation. Four independent businesses.</text><text x="60" y="116" class="body" >Account identities, queues and Run/Stop controls stay scoped.</text><rect x="60" y="160" width="1480" height="128" rx="14" class="box"/><text x="90" y="208" class="label" >Owner interfaces</text><text x="90" y="252" class="heading" >Windows dashboard  +  authenticated phone app</text><text x="1050" y="217" class="body" >Inspect · edit · approve</text><text x="1050" y="252" class="small" >Select a workspace ≠ start an engine</text><path d="M800 288V324M230 324H1370M230 324V350M610 324V350M990 324V350M1370 324V350" class="line"/><rect x="60" y="350" width="340" height="280" rx="14" class="box"/><text x="84" y="398" class="heading" >Surge</text><text x="84" y="450" class="body" >Live signals → clips</text><text x="84" y="488" class="body" >Whisper / visual review</text><text x="84" y="526" class="body" >ffmpeg / final checks</text><path d="M84 557H376" stroke="#273449" stroke-width="2"/><text x="84" y="597" class="small" >Reviewed clips + posting</text><rect x="440" y="350" width="340" height="280" rx="14" class="box"/><text x="464" y="398" class="heading" >Hollow</text><text x="464" y="450" class="body" >Premise → story</text><text x="464" y="488" class="body" >Narration / illustrations</text><text x="464" y="526" class="body" >Motion / finished review</text><path d="M464 557H756" stroke="#273449" stroke-width="2"/><text x="464" y="597" class="small" >Original story videos</text><rect x="820" y="350" width="340" height="280" rx="14" class="box"/><text x="844" y="398" class="heading" >Resonance</text><text x="844" y="450" class="body" >References → music</text><text x="844" y="488" class="body" >LocalSongLab / YuE2</text><text x="844" y="526" class="body" >Native REAPER revisions</text><path d="M844 557H1136" stroke="#273449" stroke-width="2"/><text x="844" y="597" class="small" >Private audio auditions</text><rect x="1200" y="350" width="340" height="280" rx="14" class="box"/><text x="1224" y="398" class="heading" >Social Studio</text><text x="1224" y="450" class="body" >Client facts → drafts</text><text x="1224" y="488" class="body" >Brand guides / styles</text><text x="1224" y="526" class="body" >References / calendar</text><path d="M1224 557H1516" stroke="#273449" stroke-width="2"/><text x="1224" y="597" class="small" >Manual client packages</text><path d="M800 630V698" class="line" marker-end="url(#arrow)"/><text x="835" y="674" class="small" >Shared infrastructure</text><rect x="60" y="712" width="980" height="194" rx="14" class="box"/><text x="90" y="760" class="heading" >Local engines, scoped records and Ashvane Core</text><text x="90" y="810" class="body" >Ollama / media tools · bounded workers / GPU admission</text><text x="90" y="850" class="body" >Profile-owned queues / encrypted tokens · evidence / rollback</text><path d="M1040 800H1080" class="line" marker-end="url(#arrow)"/><rect x="1090" y="712" width="450" height="194" rx="14" class="box"/><text x="1118" y="756" class="heading" >External destinations</text><text x="1118" y="805" class="body" >Surge / Hollow only</text><text x="1118" y="845" class="body" >Explicit account authorization</text><text x="60" y="960" class="small" >Resonance has no music distribution. Social Studio has no connected automatic publishing.</text></svg>
