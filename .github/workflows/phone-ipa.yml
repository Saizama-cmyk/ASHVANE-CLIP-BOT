# Builds Ashvane for iPhone (.ipa) and Android (.apk) on free GitHub runners.
#
# Apple's toolchain only runs on macOS, so the iOS build uses a macOS runner; Android builds on
# Linux. The .ipa is unsigned on purpose: your sideloader (AltStore, SideStore, Feather,
# Sideloadly, ESign, TrollStore) signs it with your own Apple ID. The .apk installs directly.
#
# Every run stamps the app as 1.0.<run number>, so each build is a real upgrade and the sideload
# feed matches the binary exactly - AltStore refuses to install when those two disagree.
name: Phone app (.ipa + .apk)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone/**"
      - ".github/workflows/phone-ipa.yml"
      - "installer/phone_manifest.py"
      - "installer/verify_phone_package.py"
      - "installer/altstore_source.py"

# Serialize publication so an older build cannot replace the newest download/feed.
concurrency:
  group: phone-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write          # publish the builds as a release and commit the sideload feed

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  ios:
    needs: version
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp the version
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("app.json")
          d = json.loads(p.read_text())
          d["expo"]["version"] = os.environ["VERSION"]
          d["expo"]["ios"]["buildNumber"] = os.environ["RUN_NUMBER"]
          p.write_text(json.dumps(d, indent=2))
          print("version", d["expo"]["version"])
          PY
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: pod install
        working-directory: phone/ios

      - name: Build without code signing
        working-directory: phone/ios
        run: |
          SCHEME=$(ls -d *.xcodeproj | head -1 | sed 's/\.xcodeproj$//')
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "Building scheme $SCHEME in $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Wrap the app into an .ipa
        working-directory: phone/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app was produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Ashvane.ipa Payload
          ls -lh Ashvane.ipa

      - name: Verify iPhone installation package
        run: |
          python3 installer/verify_phone_package.py phone/ios/Ashvane.ipa --version "$VERSION" --build-number "$RUN_NUMBER" --report phone/ios/package-report.json
          python3 installer/phone_manifest.py --ipa phone/ios/Ashvane.ipa --report phone/ios/permissions-report.json
        working-directory: .
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Ashvane-ipa
          path: |
            phone/ios/Ashvane.ipa
            phone/ios/package-report.json
            phone/ios/permissions-report.json
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stamp the version
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("app.json")
          d = json.loads(p.read_text())
          d["expo"]["version"] = os.environ["VERSION"]
          d["expo"]["android"]["versionCode"] = int(os.environ["RUN_NUMBER"])
          p.write_text(json.dumps(d, indent=2))
          PY
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the APK
        working-directory: phone/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect the APK
        working-directory: phone/android
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK" || { echo "no apk produced"; exit 1; }
          cp "$APK" ../Ashvane.apk
          ls -lh ../Ashvane.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ashvane-apk
          path: phone/Ashvane.apk
          if-no-files-found: error

  publish:
    # Waits for Android too. It used to wait only for iOS, so on a run where Android was the
    # slower of the two - which is most runs - publishing finished first and the release went
    # out with no .apk at all. `always()` keeps the iPhone build publishable on its own when
    # Android fails, which is what the "missing if Android failed" line below expects.
    needs: [version, ios, android]
    if: |
      always() && github.ref == 'refs/heads/main'
      && needs.version.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Release both builds and refresh the sideload feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          PREVIOUS=$(gh release view phone-latest --json name --jq .name --repo "$GITHUB_REPOSITORY" 2>/dev/null | sed -n 's/^Ashvane \([0-9][0-9.]*\)$/\1/p' || true)
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$VERSION" ] && [ "$(printf '%s\n' "$PREVIOUS" "$VERSION" | sort -V | tail -1)" = "$PREVIOUS" ]; then
            echo "A newer phone version ($PREVIOUS) is already published; keeping it."
            exit 0
          fi
          IPA=$(find builds -name "*.ipa" | head -1)
          APK=$(find builds -name "*.apk" | head -1)      # missing if Android failed
          test -n "$IPA" || { echo "no .ipa to publish"; exit 1; }
          SIZE=$(stat -c%s "$IPA")
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/phone-v$VERSION/Ashvane.ipa"
          python3 installer/altstore_source.py "$GITHUB_REPOSITORY" "phone-v$VERSION" "$URL" "$SIZE" --ipa "$IPA"
          ASSETS=("$IPA" "builds/Ashvane-ipa/package-report.json" "builds/Ashvane-ipa/permissions-report.json" "docs/sideload.json" "docs/altstore.json")
          if [ -n "$APK" ]; then ASSETS+=("$APK"); fi
          sha256sum "${ASSETS[@]}" | sed 's|  .*/|  |' > builds/SHA256SUMS.txt
          ASSETS+=("builds/SHA256SUMS.txt")
          NOTES="Source: $GITHUB_SHA. iPhone: unsigned package; install using your existing sideloader and Apple ID. Android: install the APK directly. Package metadata, permissions and SHA256SUMS are attached."
          if [ -z "$APK" ]; then NOTES="$NOTES Android failed in this run; no new APK is attached."; fi
          for TAG in "phone-v$VERSION" "phone-latest"; do
            # Preserve numbered releases; only the documented latest alias moves.
            if [ "$TAG" = "phone-latest" ]; then
              gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            fi
            # prerelease: the desktop updater needs its installer in /releases/latest.
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" "${ASSETS[@]}" --prerelease --target "$GITHUB_SHA" \
                --title "Ashvane $VERSION" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sideload.json docs/altstore.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phone: sideload feed for $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
